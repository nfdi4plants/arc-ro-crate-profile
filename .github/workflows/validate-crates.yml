name: Validate RO-Crates

on:
  push:
    branches: ["main"]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes a run still in progress.
concurrency:
  group: validate-crates-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published on PyPI as `roc-validator`.
  ROCRATE_VALIDATOR_VERSION: "0.13.1"

jobs:
  validate:
    name: rocrate-validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install rocrate-validator
        run: python -m pip install "roc-validator==${ROCRATE_VALIDATOR_VERSION}"
      # Checks the example crates and the profile crates with --extra-checks.
      - name: Validate crates
        run: python scripts/validate_crates.py
